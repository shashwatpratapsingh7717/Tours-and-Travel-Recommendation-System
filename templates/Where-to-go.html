<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explore Cities by Category</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    button:hover {
      color: yellow;
    }
  </style>
</head>

<body class="bg-gray-100 font-sans">
  <div class="container mx-auto py-8">
    <h1 class="text-4xl font-bold text-center text-gray-800 mb-8">Explore Cities by Category</h1>

    <!-- Category Filter -->
    <div class="flex flex-wrap justify-center gap-4 mb-6">
      <button class="filter-btn px-4 py-2 bg-blue-500 text-white rounded" data-category="All">All</button>
      <button class="filter-btn px-4 py-2 bg-blue-500 text-white rounded" data-category="Hill Station">Hill
        Station</button>
      <button class="filter-btn px-4 py-2 bg-blue-500 text-white rounded" data-category="Beach">Beach</button>
      <button class="filter-btn px-4 py-2 bg-blue-500 text-white rounded" data-category="Island">Island</button>
      <button class="filter-btn px-4 py-2 bg-blue-500 text-white rounded" data-category="Desert">Desert</button>
      <button class="filter-btn px-4 py-2 bg-blue-500 text-white rounded" data-category="Heritage">Heritage</button>
      <button class="filter-btn px-4 py-2 bg-blue-500 text-white rounded" data-category="Adventure">Adventure</button>
      <button class="filter-btn px-4 py-2 bg-blue-500 text-white rounded" data-category="Urban">Urban</button>
      <button class="filter-btn px-4 py-2 bg-blue-500 text-white rounded" data-category="Wildlife">Wildlife</button>
      <button class="filter-btn px-4 py-2 bg-blue-500 text-white rounded" data-category="Spiritual">Spiritual</button>
      <button class="filter-btn px-4 py-2 bg-blue-500 text-white rounded" data-category="Cultural">Cultural</button>
      <button class="filter-btn px-4 py-2 bg-blue-500 text-white rounded" data-category="Food">Food</button>
      <button class="filter-btn px-4 py-2 bg-blue-500 text-white rounded" data-category="Nature">Nature</button>
      <button class="filter-btn px-4 py-2 bg-blue-500 text-white rounded" data-category="Other">Other</button>
    </div>

    <!-- Cities Grid -->
    <div id="city-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- City cards will be injected here -->
    </div>
    <div class="flex justify-center mt-6">
      <button id="load-more-btn"
        class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-6 rounded-full shadow-md transition-all duration-300">
        Load More
      </button>
    </div>

  </div>
  <script>
    const cities = [];
    let currentIndex = 0;
    const pageSize = 30;

    function createCard(city) {
      return `
        <div class="city-card bg-white rounded-xl shadow p-4" data-category="${city.Category}">
          <img src="${city.Image_URL || 'https://via.placeholder.com/300x200'}" loading="lazy" alt="${city.City}" class="w-full h-48 object-cover rounded-md mb-3">
          <h2 class="text-xl font-semibold text-gray-800">${city.City}</h2>
          <p class="text-sm text-gray-600 mb-1">Rating: ${city.Ratings} | Duration: ${city.Ideal_duration}</p>
          <p class="text-gray-700 text-sm">${city.City_desc.slice(0, 100)}...</p>
        </div>
      `;
    }

    function displayCities(filter = "All", append = false) {
      const grid = document.getElementById("city-grid");
      const filtered = filter === "All" ? cities : cities.filter(city => city.Category === filter);
      const slice = filtered.slice(0, currentIndex + pageSize);

      if (!append) grid.innerHTML = ''; // Clear previous if not appending
      grid.innerHTML = slice.map(createCard).join("");

      currentIndex += pageSize;

      const loadMoreBtn = document.getElementById("load-more-btn");
      if (currentIndex >= filtered.length) {
        loadMoreBtn.classList.add("hidden");
      } else {
        loadMoreBtn.classList.remove("hidden");
      }
    }

    fetch("cities_with_categories.json")
      .then(res => res.json())
      .then(data => {
        cities.push(...data);
        displayCities();

        let currentFilter = "All";

        document.querySelectorAll(".filter-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            currentFilter = btn.getAttribute("data-category");
            currentIndex = 0;
            displayCities(currentFilter);
          });
        });

        document.getElementById("load-more-btn").addEventListener("click", () => {
          displayCities(currentFilter, true);
        });
      })
      .catch(() => {
        console.error("Failed to load city data.");
      });
  </script>


</body>

</html>
