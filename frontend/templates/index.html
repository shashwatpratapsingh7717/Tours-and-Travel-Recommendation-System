<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Travel Recommendation System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script> <!-- FontAwesome -->
</head>
<body class="bg-gray-100 text-gray-800">

  <!-- Sticky Header -->
  <header class="bg-white shadow sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <img src="https://img.icons8.com/ios-filled/50/000000/airport.png" class="h-8" alt="logo">
        <span class="text-xl font-bold text-blue-600">TravelMate</span>
        <!-- <nav class="flex gap-6 ml-8 text-sm">
          <a href="#" class="flex items-center gap-1 text-gray-600 hover:text-blue-600 transition">✈️ Flights</a>
          <a href="#" class="flex items-center gap-1 text-gray-600 hover:text-blue-600 transition">🏨 Hotels</a>
          <a href="#" class="flex items-center gap-1 text-gray-600 hover:text-blue-600 transition">🌴 Holiday Packages</a>
        </nav> -->
      </div>
      <div>
        {% if session.username %}
        <div class="flex flex-col items-end">
          <span class="font-semibold text-blue-600">Welcome, {{ session.username }}</span>
          <a href="{{ url_for('logout') }}"
             class="text-sm mt-1 text-red-500 hover:text-red-600 hover:underline">
             🔓 Logout
          </a>
        </div>
      {% else %}
        <button onclick="toggleModal()" class="bg-blue-600 text-white px-4 py-1 rounded-full text-sm hover:bg-blue-700">👤 Profile</button>
      {% endif %}
      
      </div>
    </div>

    <!-- Submenu -->
    <div class="bg-blue-50 py-2 px-4">
      <div class="max-w-7xl mx-auto flex gap-6 text-sm text-gray-600">
        <a href="#" id="homeLink" class="hover:text-blue-600">Home</a>
        <a href="{{ url_for('where_to_go') }}" class="hover:text-blue-600">Where to Go</a>
        <a href="{{ url_for('popular_cities') }}" class="hover:text-blue-600">Popular Cities</a>
      </div>
    </div>
  </header>

  <!-- Main Section -->
  <main class="max-w-7xl mx-auto p-4">
    <h1 class="text-3xl font-bold text-center text-blue-700 my-6">Discover Indian Places</h1>

    <!-- Search Bar -->
    <div class="flex justify-center mb-6 gap-2">
      <input id="searchInput" type="text" placeholder="Enter a city or keyword..."
        class="border border-gray-300 rounded-l px-4 py-2 w-1/2 focus:outline-none" />
      <button onclick="searchCity()" class="bg-blue-600 text-white px-4 rounded hover:bg-blue-700">Search</button>
      <button onclick="clearHistory()" class="bg-gray-300 text-gray-800 px-4 rounded hover:bg-gray-400">Clear History</button>
    </div>
    <!-- Headings for City Sections -->
<h2 id="topCitiesHeading" class="text-2xl font-semibold mb-4 text-gray-700">Top Cities</h2>
<h2 id="recommendedCitiesHeading" class="text-2xl font-semibold mb-4 text-gray-700 hidden">Recommended for you </h2>


    <!-- Result Container -->
     <div id="loadingSpinner" class="hidden flex flex-col items-center justify-center my-10">
  <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
  <p class="text-blue-600 mt-4 font-medium animate-pulse">AI is finding the perfect destinations...</p>
    </div>

    <div id="resultContainer" class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Cards will be inserted here -->
    </div>
    <!-- Banner -->
    <div class="my-10">
      <img src="{{ url_for('static', filename='banner1.png') }}"
        class="w-full h-48 object-cover rounded-lg shadow" alt="Travel Experience Banner">
    </div>
    <div class="my-10">
      <img src="{{ url_for('static', filename='banner2.png') }}"
        class="w-full h-48 object-cover rounded-lg shadow" alt="Travel Experience Banner">
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t mt-10 py-6">
    <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
      <div class="text-sm text-gray-500">© 2025 TravelMate</div>
      <div class="flex gap-4">
        <a href="#"><img src="https://img.icons8.com/ios-filled/24/000000/instagram-new.png" alt="Instagram icon" /></a>
        <a href="#"><img src="https://img.icons8.com/ios-filled/24/000000/facebook-new.png" alt="Facebook icon" /></a>
        <a href="#"><img src="https://img.icons8.com/ios-filled/24/000000/linkedin.png" alt="LinkedIn icon" /></a>
      </div>
    </div>
  </footer>

  <!-- Modal + Tab Switcher Script -->
  <script>
    const signupTab = document.getElementById("signupTab");
    const loginTab = document.getElementById("loginTab");
    const signupForm = document.getElementById("signupForm");
    const loginForm = document.getElementById("loginForm");
    const authModal = document.getElementById("authModal");

    function toggleModal() {
      authModal.classList.toggle("hidden");
      authModal.classList.toggle("flex");
    }

    signupTab.addEventListener("click", () => {
      signupForm.classList.remove("hidden");
      loginForm.classList.add("hidden");
      signupTab.classList.add("bg-blue-600", "text-white");
      signupTab.classList.remove("bg-gray-200", "text-gray-600");
      loginTab.classList.remove("bg-blue-600", "text-white");
      loginTab.classList.add("bg-gray-200", "text-gray-600");
    });

    loginTab.addEventListener("click", () => {
      loginForm.classList.remove("hidden");
      signupForm.classList.add("hidden");
      loginTab.classList.add("bg-blue-600", "text-white");
      loginTab.classList.remove("bg-gray-200", "text-gray-600");
      signupTab.classList.remove("bg-blue-600", "text-white");
      signupTab.classList.add("bg-gray-200", "text-gray-600");
    });
  </script>

  <script src="/static/script.js"></script>
  <script>
    const currentUser = "{{ username or '' }}";
  if (currentUser) {
    localStorage.setItem("currentUser", currentUser);
  } else {
    localStorage.removeItem("currentUser");
  }
  </script>
  <script>
  const searchInput = document.getElementById('searchInput');
  const suggestions = [
    "Try 'A quiet hill station in winter'...",
    "Try 'A sunny beach for summer'...",
    "Try 'Manali'...",
    "Try 'Historical places with temples'..."
  ];
  
  let currentSuggestion = 0;
  
  setInterval(() => {
    searchInput.setAttribute('placeholder', suggestions[currentSuggestion]);
    currentSuggestion = (currentSuggestion + 1) % suggestions.length;
  }, 3000); // Changes every 3 seconds
</script>
</body>
</html>
